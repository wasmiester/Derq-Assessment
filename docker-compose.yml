version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: traffic_database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Dedicated Seeder: Only wakes up when the "setup" profile is invoked
  # Dedicated Seeder: Only wakes up when the "setup" profile is invoked
  seeder:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: traffic_seeder
    profiles:
      - setup                     
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=database
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
    depends_on:
      database:
        condition: service_healthy
    command: ["node", "backend/seed.js"] # <-- Fixed: Changed from cmd: to command:s default CMD to JUST run the seed script

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: traffic_api
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=database
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - PORT=5000
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: traffic_frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api

volumes:
  pgdata: